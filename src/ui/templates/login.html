<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · VintedBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
  <div class="panel login-card">
    <h1>Vinted<span class="text-money">Bot</span></h1>
    <p class="meta">Panel de control</p>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="primary" type="submit" style="width:100%">Entrar</button>
    </form>
  </div>
  {% include "_github_seal.html" %}
  <script src="/static/js/app.js"></script>
</body>
</html>
