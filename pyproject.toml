[project]
name = "vintedbot"
version = "0.1.0"
description = "Generador de anuncios y agente de negociación con IA para revendedores en Vinted"
authors = [{ name = "VintedBot" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0",
    "anthropic>=0.40.0",
    "Pillow>=10.4.0",
    "stripe>=11.0.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # Error
    "F",   # Pyflakes
    "I",   # Isort
    "N",   # PEP8-naming
    "UP",  # Pyupgrade
    "B",   # Bugbear
    "C4",  # Comprehensions
    "SIM", # Simplify
    "RET", # Return
]
ignore = [
    "E501",
    "B008",  # Depends(...) como valor por defecto es el patrón idiomático de FastAPI
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
